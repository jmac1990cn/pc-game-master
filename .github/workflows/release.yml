name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build installer
        shell: bash
        run: npm run build 2>&1 | tee build-full.log
        env:
          DEBUG: electron-builder

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PC Game Master-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Surface build error on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "===== BUILD LOG (last 120 lines) ====="
          tail -n 120 build-full.log
          BODY="$(tail -n 120 build-full.log)"
          NUM=$(gh issue list --repo "$GH_REPO" --search "CI Build Failure Log in:title" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --repo "$GH_REPO" --body "$BODY" || true
          else
            gh issue create --repo "$GH_REPO" --title "CI Build Failure Log" --body "$BODY" || true
          fi
